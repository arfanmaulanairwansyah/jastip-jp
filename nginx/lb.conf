# Internal load balancer — distribusi traffic dari gateway ke service cluster
# Lapisan 1.5: antara gateway dan microservices
# Algoritma: least_conn — kirim ke replika dengan koneksi aktif paling sedikit
#
# Scale tiap service:
#   docker compose up -d --scale user-service=3
#   docker compose up -d --scale catalog-service=3
#   docker compose up -d --scale order-service=3
# Setelah scale, reload nginx agar DNS di-resolve ulang:
#   docker compose exec lb nginx -s reload

events {
    worker_connections 1024;
}

http {
    # Docker internal DNS — re-resolve upstream IP setiap 30 detik
    # Variable-based proxy_pass wajib agar resolver aktif dan IP di-update otomatis
    # saat service restart tanpa perlu nginx -s reload manual
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ─── Health check endpoint LB sendiri ───────────────────────────────────
    server {
        listen 9000;
        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"lb"}';
            add_header Content-Type application/json;
        }
    }

    # ─── User Service LB — port 3001 ────────────────────────────────────────
    server {
        listen 3001;
        location / {
            set $upstream "user-service:3001";
            proxy_pass         http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Request-Id      $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }
    }

    # ─── Catalog Service LB — port 3002 ─────────────────────────────────────
    server {
        listen 3002;
        location / {
            set $upstream "catalog-service:3002";
            proxy_pass         http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Request-Id      $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }
    }

    # ─── Order Service LB — port 3003 ────────────────────────────────────────
    server {
        listen 3003;
        location / {
            set $upstream "order-service:3003";
            proxy_pass         http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Request-Id      $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }
    }
}
