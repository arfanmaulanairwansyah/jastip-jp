# nginx sebagai load balancer di depan gateway (Lapisan 2 — Panduan Infrastructure & DevOps)
# Distribusi koneksi: least_conn — kirim ke gateway dengan koneksi aktif paling sedikit

events {
    worker_connections 1024;
}

http {
    upstream gateway_cluster {
        least_conn;
        server gateway:3000;
        # Untuk demo scaling, jalankan: docker compose up -d --scale gateway=3
        # Docker internal DNS otomatis mendistribusikan ke semua replica bernama "gateway"
    }

    server {
        listen 80;

        # Health check endpoint nginx sendiri — dipakai oleh QA dan demo
        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"nginx"}';
            add_header Content-Type application/json;
        }

        # Semua request diteruskan ke gateway_cluster
        location / {
            proxy_pass         http://gateway_cluster;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-Id      $request_id;

            # Timeout yang wajar untuk API
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }
    }
}
