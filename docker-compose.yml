# Topologi sesuai docs/ARCHITECTURE.md §10
# Lapisan 1: Microservices + healthcheck
# Lapisan 2: nginx load balancer di depan gateway (port 8080)
#
# Cara menjalankan:
#   docker compose up -d --build
#   curl http://localhost:8080/health
#
# Scale gateway:
#   docker compose up -d --scale gateway=3

services:

  # ─── Lapisan 2: Load Balancer ─────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    command: /bin/sh -c "rm -f /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  # ─── API Gateway ──────────────────────────────────────────────────────────
  gateway:
    build: ./gateway
    volumes:
      - ./frontend:/app/public:ro
    environment:
      PORT: 3000
      USER_SERVICE_URL: http://user-service:3001
      CATALOG_SERVICE_URL: http://catalog-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
      # harus sama dengan JWT_SECRET di user-service — gateway verifikasi token ini
      JWT_SECRET: ${JWT_SECRET:-ganti_dengan_secret_minimal_32_karakter_ini}
    depends_on:
      user-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - internal

  # ─── Application Services ─────────────────────────────────────────────────
  user-service:
    build: ./services/user-service
    environment:
      PORT: 3001
      DATABASE_URL: postgres://postgres:postgres@user-db:5432/user_db
      JWT_SECRET: ${JWT_SECRET:-ganti_dengan_secret_minimal_32_karakter_ini}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    depends_on:
      user-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - internal

  catalog-service:
    build: ./services/catalog-service
    environment:
      PORT: 3002
      DATABASE_URL: postgres://postgres:postgres@catalog-db:5432/catalog_db
      REDIS_URL: redis://redis:6379
    depends_on:
      catalog-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - internal

  order-service:
    build: ./services/order-service
    environment:
      PORT: 3003
      DATABASE_URL: postgres://postgres:postgres@order-db:5432/order_db
      REDIS_URL: redis://redis:6379
      USER_SERVICE_URL: http://user-service:3001
      CATALOG_SERVICE_URL: http://catalog-service:3002
    depends_on:
      order-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - internal

  # ─── Infrastruktur: Cache & Database ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - internal

  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - internal

  catalog-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catalog_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - internal

  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - internal

# ─── Network & Volumes ────────────────────────────────────────────────────────
networks:
  internal:
    driver: bridge

volumes:
  redis-data:
  user-db-data:
  catalog-db-data:
  order-db-data:
